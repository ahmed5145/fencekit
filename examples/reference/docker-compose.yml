# Local-only demo stack. No cloud services, no monthly bill.
# Requires Docker Desktop (or any Docker engine) on your machine.
services:
  redis:
    image: redis:7
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 10
