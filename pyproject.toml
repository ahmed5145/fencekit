[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "fencekit"
version = "0.5.0"
description = "Redis-backed idempotent task primitives: fencing tokens and distributed locks"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "Ahmed Mohamed", email = "ahmedmohamed200354@gmail.com" },
]
maintainers = [
    { name = "Ahmed Mohamed", email = "hussah01@luther.edu" },
]
keywords = [
    "redis",
    "distributed-lock",
    "fencing-token",
    "idempotency",
    "celery",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Distributed Computing",
    "Typing :: Typed",
]
dependencies = [
    "redis>=5.0.0",
]

[project.urls]
Homepage = "https://github.com/ahmed5145/fencekit"
Documentation = "https://github.com/ahmed5145/fencekit/blob/main/DESIGN.md"
Comparison = "https://github.com/ahmed5145/fencekit/blob/main/docs/COMPARISON.md"
Changelog = "https://github.com/ahmed5145/fencekit/blob/main/CHANGELOG.md"
Repository = "https://github.com/ahmed5145/fencekit"

[project.optional-dependencies]
django = [
    "django>=4.2",
]
celery = [
    "celery>=5.3",
]
dev = [
    "pytest>=8.0",
    "pytest-timeout>=2.3",
    "hypothesis>=6.100",
    "ruff>=0.8",
    "mypy>=1.13",
    "django>=4.2",
    "celery>=5.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/fencekit"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/docs",
    "/examples",
    "/README.md",
    "/DESIGN.md",
    "/CHANGELOG.md",
    "/LICENSE",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
markers = [
    "integration: tests that require a real Redis instance (FENCEKIT_REDIS_URL)",
]
timeout = 60
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
    "RUF",
]

[tool.ruff.lint.isort]
known-first-party = ["fencekit"]

[tool.ruff.lint.per-file-ignores]
# Django must be configured before model imports.
"tests/unit/test_django_storage.py" = ["E402"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["fencekit"]
